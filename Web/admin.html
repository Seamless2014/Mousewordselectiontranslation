<title>访客统计后台 · 悬停取词翻译</title>
<style>
:root {
  --bg: #f6f8fc;
  --bg2: #ffffff;
  --ink: #0f172a;
  --ink-soft: #1e293b;
  --muted: #64748b;
  --rule: #e2e8f0;
  --accent: #4a8cff;
  --accent2: #6b5cff;
  --accent-soft: rgba(74, 140, 255, 0.08);
  --accent-grad: linear-gradient(135deg, #4a8cff 0%, #6b5cff 100%);
  --danger: #dc2626;
  --ok: #16a34a;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 20px rgba(15, 23, 42, 0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg);
  line-height: 1.6;
}
button { font-family: inherit; cursor: pointer; }
a { color: var(--accent); }

/* ---------- 登录 ---------- */
.login-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.login-card {
  width: 100%; max-width: 380px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow: var(--shadow-md);
}
.login-card .logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 17px; margin-bottom: 6px;
}
.logo-icon {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent-grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
}
.login-card .sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.login-card input {
  width: 100%; padding: 11px 14px;
  border: 1px solid var(--rule); border-radius: 9px;
  font-size: 14px; font-family: inherit; outline: none;
  transition: border-color .15s;
}
.login-card input:focus { border-color: var(--accent); }
.btn {
  padding: 11px 18px; border: none; border-radius: 9px;
  font-size: 14px; font-weight: 600;
  background: var(--accent-grad); color: #fff;
  box-shadow: 0 4px 14px rgba(74,140,255,.3);
  transition: transform .12s, box-shadow .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(74,140,255,.4); }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.btn-ghost {
  background: var(--bg2); color: var(--ink-soft);
  border: 1px solid var(--rule); box-shadow: none;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
.login-card .btn { width: 100%; margin-top: 16px; }
.login-err {
  display: none; margin-top: 12px; padding: 9px 12px;
  background: #fef2f2; color: var(--danger);
  border-radius: 8px; font-size: 13px;
}
.login-err.show { display: block; }

/* ---------- 后台主框架 ---------- */
.app { display: none; min-height: 100vh; }
.app.on { display: block; }
.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
  padding: 0 28px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar .right { display: flex; align-items: center; gap: 16px; }
.topbar .who { font-size: 12px; color: var(--muted); }
.main { max-width: 1400px; margin: 0 auto; padding: 26px 28px 60px; }

/* 卡片 */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.card {
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow-sm);
}
.card .c-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.card .c-num {
  font-size: 30px; font-weight: 700; line-height: 1.1;
  background: var(--accent-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.card .c-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }

/* 工具栏 */
.panel {
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  margin-bottom: 22px;
}
.panel-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule);
}
.panel-title { font-weight: 700; font-size: 15px; }
.tabs { display: inline-flex; background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; }
.tabs button {
  border: none; background: none; padding: 6px 16px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  border-radius: 7px;
}
.tabs button.on { background: var(--bg2); color: var(--accent); box-shadow: var(--shadow-sm); }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; }
.seg button {
  border: none; background: none; padding: 4px 12px;
  font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 6px;
}
.seg button.on { background: var(--accent-grad); color: #fff; }
.panel-bd { padding: 20px; }

/* 图表 */
.chart-wrap { width: 100%; overflow-x: auto; }
.chart-svg { display: block; min-width: 600px; width: 100%; height: 260px; }
.bar { fill: url(#barGrad); transition: opacity .15s; }
.bar:hover { opacity: .8; }
.bar-uv { fill: #a78bfa; }
.axis-text { fill: var(--muted); font-size: 10px; }
.grid-line { stroke: var(--rule); stroke-width: 1; }
.chart-empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 13px; }

/* 明细表格 */
.toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.toolbar input[type=search] {
  padding: 9px 13px; border: 1px solid var(--rule); border-radius: 9px;
  font-size: 13px; font-family: inherit; outline: none; width: 240px;
}
.toolbar input[type=search]:focus { border-color: var(--accent); }
.toolbar select {
  padding: 9px 10px; border: 1px solid var(--rule); border-radius: 9px;
  font-size: 13px; font-family: inherit; outline: none; background: var(--bg2);
}
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1000px; }
thead th {
  text-align: left; padding: 11px 14px;
  background: #f8fafc; color: var(--muted);
  font-weight: 600; font-size: 12px; white-space: nowrap;
  border-bottom: 1px solid var(--rule);
}
tbody td {
  padding: 10px 14px; border-bottom: 1px solid #f1f5f9;
  vertical-align: top; white-space: nowrap;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #fafbff; }
td.ip { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; font-weight: 600; }
td.time { color: var(--muted); font-size: 12px; }
td.loc { white-space: normal; min-width: 150px; }
.tag {
  display: inline-block; padding: 1px 8px; border-radius: 5px;
  font-size: 11px; font-weight: 600;
}
.tag-pc { background: #eff6ff; color: #2563eb; }
.tag-mobile { background: #f0fdf4; color: #16a34a; }
.tag-bot { background: #fef2f2; color: #dc2626; }
.muted { color: var(--muted); }
.empty-row td { text-align: center; padding: 40px; color: var(--muted); }

/* 分页 */
.pager {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 14px 4px 0;
}
.pager .info { font-size: 12px; color: var(--muted); }
.pager .ctrl { display: flex; align-items: center; gap: 8px; }
.pager button {
  padding: 7px 14px; border: 1px solid var(--rule); background: var(--bg2);
  border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft);
}
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button:disabled { opacity: .45; cursor: not-allowed; }
.pager input {
  width: 56px; padding: 7px 8px; text-align: center;
  border: 1px solid var(--rule); border-radius: 8px; font-size: 13px; outline: none;
}
.toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-80px);
  background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 10px;
  font-size: 13px; box-shadow: var(--shadow-md);
  transition: transform .25s; z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); }
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="logo"><span class="logo-icon">译</span>访客统计后台</div>
    <div class="sub">仅站点管理员可访问，访客无法看到此页面。</div>
    <label for="pwd">管理口令</label>
    <input type="password" id="pwd" placeholder="请输入管理口令" autocomplete="current-password">
    <div class="login-err" id="loginErr"></div>
    <button class="btn" id="loginBtn">登 录</button>
  </div>
</div>

<!-- 后台 -->
<div class="app" id="appView">
  <div class="topbar">
    <div class="logo"><span class="logo-icon">译</span>访客统计后台</div>
    <div class="right">
      <span class="who" id="who"></span>
      <button class="btn btn-ghost" id="logoutBtn">退出登录</button>
    </div>
  </div>

  <div class="main">
    <!-- 汇总卡片 -->
    <div class="cards">
      <div class="card"><div class="c-label">今日访问量 PV</div><div class="c-num" id="kTodayPv">–</div><div class="c-sub">自然日 00:00 起（北京时间）</div></div>
      <div class="card"><div class="c-label">今日独立访客 UV</div><div class="c-num" id="kTodayUv">–</div><div class="c-sub">按 IP 去重</div></div>
      <div class="card"><div class="c-label">累计访问量 PV</div><div class="c-num" id="kTotalPv">–</div><div class="c-sub">自有记录以来</div></div>
      <div class="card"><div class="c-label">累计独立访客 UV</div><div class="c-num" id="kTotalUv">–</div><div class="c-sub">按 IP 去重</div></div>
    </div>

    <!-- 趋势 -->
    <div class="panel">
      <div class="panel-hd">
        <span class="panel-title" id="chartTitle">访问趋势</span>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <div class="seg" id="metricSeg">
            <button data-metric="pv" class="on">PV</button>
            <button data-metric="uv">UV</button>
          </div>
          <div class="tabs" id="rangeTabs">
            <button data-range="day" class="on">日</button>
            <button data-range="week">周</button>
            <button data-range="month">月</button>
            <button data-range="year">年</button>
          </div>
        </div>
      </div>
      <div class="panel-bd">
        <div class="chart-wrap" id="chartWrap"></div>
      </div>
    </div>

    <!-- 访客明细 -->
    <div class="panel">
      <div class="panel-hd">
        <span class="panel-title">访客明细</span>
      </div>
      <div class="panel-bd">
        <div class="toolbar">
          <input type="search" id="qInput" placeholder="搜索 IP / 归属地 / 浏览器…">
          <button class="btn btn-ghost" id="searchBtn">搜索</button>
          <span style="flex:1"></span>
          <label class="muted" for="sizeSel" style="font-size:13px;">每页</label>
          <select id="sizeSel">
            <option value="20">20 条</option>
            <option value="50">50 条</option>
            <option value="200">200 条</option>
            <option value="1000">1000 条</option>
          </select>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>访问时间</th>
                <th>IP</th>
                <th>归属地（国家 / 省 / 市 / 区县）</th>
                <th>运营商</th>
                <th>设备</th>
                <th>浏览器 / 系统</th>
                <th>来源</th>
                <th>路径</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pager">
          <span class="info" id="pageInfo"></span>
          <div class="ctrl">
            <button id="firstBtn">首页</button>
            <button id="prevBtn">上一页</button>
            <span>第 <input type="number" id="pageInput" min="1"> / <span id="totalPages">1</span> 页</span>
            <button id="nextBtn">下一页</button>
            <button id="lastBtn">末页</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
